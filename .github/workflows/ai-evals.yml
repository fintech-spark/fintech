name: AI evaluations

on:
  workflow_dispatch:
    inputs:
      run_evals:
        description: "Run paid/provider-backed synthetic evaluations"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  provider-evals:
    if: inputs.run_evals == true
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Offline evaluations
        run: npm run eval
      - name: Run real provider evaluations
        run: npm run eval:live -- --reporter=default --reporter=json --outputFile=evals/provider-results.json
        env:
          AI_EVAL_LIVE: '1'
          AI_EVAL_PROVIDER: ${{ vars.AI_EVAL_PROVIDER || 'google' }}
          AI_EVAL_MODEL: ${{ vars.AI_EVAL_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Upload evaluation output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provider-eval-results
          path: evals/provider-results.json
          if-no-files-found: ignore
