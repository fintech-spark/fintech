# Gitleaks configuration for Merchant Brain
# Extends default gitleaks rules and defines allowlists for synthetic test fixtures

[extend]
useDefault = true

[[allowlists]]
description = "Ignore synthetic credentials in test fixtures"
paths = [
  '''tests/rag/pipeline\.test\.ts''',
  '''tests/.*''',
]

[[allowlists]]
description = "Ignore synthetic GCP test API key in pipeline test"
regexes = [
  '''AIzaSy[0-9A-Za-z_-]{20,}''',
]

[[allowlists]]
description = "Ignore historical synthetic test fixture commits"
commits = [
  "53969df4832171779ac208b9780ad6ac7f5113f7",
]
